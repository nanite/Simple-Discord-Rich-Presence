import groovy.json.JsonSlurper

plugins {
    id "architectury-plugin" version "3.4-SNAPSHOT"
    id "dev.architectury.loom" version "1.7-SNAPSHOT" apply false
    id "me.modmuss50.mod-publish-plugin" version "0.8.3"
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom"

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    def ENV = System.getenv()

    archivesBaseName = rootProject.archives_base_name
    version = "${mod_version}+mc${minecraft_version}"
    group = rootProject.maven_group

    repositories {
        maven {
            url "https://maven.ftb.dev/releases"
            content {
                includeGroup "dev.ftb.mods"
            }
        }
        maven {
            url 'https://jitpack.io'
            content {
                includeGroup "com.github.jagrosh"
            }
        }
        maven {
            url 'https://maven.neoforged.net/releases'
        }
    }

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
        options.release = 21
    }

    java {
        withSourcesJar()
    }

    publishing {
        repositories {
            if (ENV.NANITE_TOKEN) {
                maven {
                    url "https://maven.nanite.dev/releases"
                    credentials {
                        username = "nanite"
                        password = "${ENV.NANITE_TOKEN}"
                    }
                }
            }
        }
    }
}

publishMods {
    dryRun = providers.environmentVariable("CURSE_TOKEN").getOrNull() == null
    changelog = file("./CHANGELOG.md").text
    version = "${mod_version}"
    type = STABLE

    def fabricOptions = publishOptions {
        file = project.provider { project(":fabric").tasks.remapJar }.flatMap { it.archiveFile }
        displayName = "[FABRIC][${minecraft_version}] ${project.name} ${mod_version}"
        modLoaders.add("fabric")
    }

    def neoforgeOptions = publishOptions {
        file = project.provider { project(":neoforge").tasks.remapJar }.flatMap { it.archiveFile }
        displayName = "[NEOFORGE][${minecraft_version}] ${project.name} ${mod_version}"
        modLoaders.add("neoforge")
    }

    def curseForgeOptions = curseforgeOptions {
        accessToken = providers.environmentVariable("CURSE_TOKEN")
        projectId = "${curseforge_id}"
        minecraftVersions.add("${minecraft_version}")
    }

    def modrinthOptions = modrinthOptions {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = "${modrinth_id}"
        minecraftVersions.add("${minecraft_version}")
    }

    curseforge("curseforgeFabric") {
        from(curseForgeOptions, fabricOptions)
        requires {
            slug = "fabric-api"
        }
        requires {
            slug = "cloth-config"
        }
        requires {
            slug = "architectury-api"
        }
    }

    curseforge("curseforgeNeoforge") {
        from(curseForgeOptions, neoforgeOptions)
        requires {
            slug = "cloth-config"
        }
        requires {
            slug = "architectury-api"
        }
    }

    if (providers.environmentVariable("MODRINTH_TOKEN").getOrNull() != null) {
        modrinth("modrinthFabric") {
            from(modrinthOptions, fabricOptions)
            requires {
                slug = "fabric-api"
            }
            requires {

                slug = "cloth-config"
            }
            requires {
                slug = "architectury-api"
            }
        }

        modrinth("modrinthNeoforge") {
            from(modrinthOptions, neoforgeOptions)
            requires {
                slug = "cloth-config"
            }
            requires {
                slug = "architectury-api"
            }
        }
    }
}


tasks.register("getMinecraftIncrementalId") {
    group = "other"

    doLast {
        // Load the versions data
        def url = "https://launchermeta.mojang.com/mc/game/version_manifest_v2.json"
        def json = new JsonSlurper().parseText(url.toURL().text)
        def versions = json.versions

        // Reverse the list so the oldest version is first
        versions = versions.reverse()

        def currentNumber = 0;
        for (version in versions) {
            if (version.type != "release") {
                continue
            }

            currentNumber++
            if (version.id == rootProject.minecraft_version) {
                break
            }
        }

        println("Minecraft incremental ID: ${currentNumber}")
    }
}