plugins {
    id 'net.fabricmc.fabric-loom'
}

loom {
    // accessWidenerPath = project(":common").file("src/main/resources/sdrp.accesswidener")

    runs {
        configureEach {
            ideConfigGenerated = true
        }
    }

    mods {
        "sdrp" {
            sourceSet sourceSets.main
            sourceSet("main", ":common")
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    implementation "me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}"

    include(implementation("dev.nanite.forks:discord-ipc:${ipc_version}"))
}

java {
    withSourcesJar()
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            groupId project.group
            artifactId project.base.archivesName.get()
            version project.version
            from components.java
        }
    }
}
